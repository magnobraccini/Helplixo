spring.application.name=helplixo-web
server.port=8080

# Dados de teste dos chamados (no sistema real, isto vira o banco de dados)
helplixo.dados.chamados=classpath:dados-teste/chamados.json
helplixo.dados.maquinas=classpath:dados-teste/maquinas.json
helplixo.dados.contatos=classpath:dados-teste/contatos.json

# Pastas e processos no formato do Helplixo atual (folders.json + processes/*.json). Só leitura.
# Para ler a cópia de teste: helplixo.dados.processos=file:C:/Users/magnoC.dgi/Projetos/helplixo-dados-teste
# NUNCA aponte para a pasta de dados da rede (G:).
helplixo.dados.processos=classpath:dados-teste/helplixo

# A senha de edição NUNCA fica aqui nem no Git: vem da variável de ambiente HELPLIXO_SENHA_EDICAO.
# Sem a variável, o modo edição fica desligado. A chave de edição vale 8 horas.
helplixo.edicao.senha=${HELPLIXO_SENHA_EDICAO:}
helplixo.edicao.validade-horas=8
